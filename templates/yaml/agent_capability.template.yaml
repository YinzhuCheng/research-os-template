domain_id: example-domain
agents:
  - agent_id: example-agent
    role: "Describe the role in one sentence."
    inputs:
      - input_artifact
    outputs:
      - output_artifact
    allowed_paths:
      - domain_profiles/example-domain/
      - templates/domain/example-domain/
