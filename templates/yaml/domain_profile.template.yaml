domain_id: example-domain
display_name: "Example Domain"
research_family: example_family
classification_sources:
  - name: "Authoritative taxonomy"
    url: "https://example.org/taxonomy"
activation:
  default_enabled: false
  researcher_decision_required: true
  triggers:
    - example trigger
paradigms:
  - id: example-paradigm
    purpose: "Describe the domain research pattern."
artifact_types:
  - example_artifact
kernel_bindings:
  candidate:
    artifacts:
      - example_artifact
  evaluator_contract:
    artifacts:
      - example_evaluation_plan
    required_fields:
      - metric_or_check
      - formula_or_procedure
      - inputs
      - units_or_scale
      - acceptance_threshold
      - resource_estimate
      - failure_mode
      - replay_note
  evaluation_result:
    artifacts:
      - example_result_report
  belief_state:
    artifacts:
      - example_assumption_register
  search_trace:
    artifacts:
      - example_iteration_log
  negative_result:
    artifacts:
      - example_failure_log
    policy: "Preserve failed candidates and inconclusive checks."
  next_action_policy:
    artifacts:
      - example_next_step_decision
  human_judgment_gate:
    artifacts:
      - example_review_decision
  computation_checklist_required: true
quality_gates:
  - example_quality_gate
status_lifecycle:
  common:
    - draft
    - needs_human_review
    - evidence_linked
    - counterexample_or_failure_checked
    - ready_for_public_export
  domain_specific:
    - example_status
harness_boundaries:
  allowed_write_roots:
    - domain_profiles/
    - templates/domain/example-domain/
    - PROVENANCE/
  forbidden_write_roots:
    - PRIVATE/
  paid_resources: false
  code_execution: "only through research-os-execution-harness when approved"
  external_write: forbidden_without_explicit_human_confirmation
  public_claim_rule: "State the domain-specific public claim rule."
source_basis:
  - name: "Primary source"
    url: "https://example.org/source"
