  - "Need paid API calls, cloud resources, GPU resources, lab resources, or external platform writeback."
  - "Need to store real API keys, account tokens, cookies, authorization headers, or provider secrets."
  - "Need to modify or vendor the official Codex source code."
  - "Need to run a real Codex model turn that consumes paid or account-limited resources."
acceptance_criteria:
  - "A Tauri + React desktop app skeleton exists under apps/research-os-desktop."
  - "A Python sidecar exists under apps/research-os-sidecar and owns projects, profiles, state, permissions, archives, and Codex mediation."
  - ".rosproj project creation creates a project-root sandbox, Research OS seed, PRIVATE/PROVENANCE/PUBLIC/CONTROL/config structure, and initial git commit."
  - "Profile metadata never stores API keys, tokens, cookies, passwords, or authorization headers."
  - "Codex SDK integration is optional at import time and fails safely when unavailable."
  - "Codex command/file/permission approvals are routed through Research OS UI and are not auto-accepted."
  - "UI exposes project center, three-phase workspace, choice prompts with recommended/options/free-form, final product selection, approvals, runtime events, and archives."
  - "Static checks and sidecar unit tests pass without touching PRIVATE/ or real credentials."
requires_confirmation: true
privacy_level: public
