  max_runtime_minutes: null
stop_conditions:
  - "Need to commit real PRIVATE intake material."
  - "Need to store real API keys, account tokens, cookies, authorization headers, or provider secrets."
  - "Need external writeback other than git push to the current branch or read-only online source verification."
  - "Yunwu usage cannot be measured or estimated safely before paid review calls."
  - "gpt-5.5 or xhigh reasoning is unavailable and no user-approved fallback exists."
acceptance_criteria:
  - "Research OS Desktop treats the previous manuscript/PDF/PPT/notes/templates/examples as initialization material, not as an already accepted final product."
  - "Research OS Desktop can ingest and reason over the full neural-network folder, including templates, example papers, venue rules, prior proof audits, screenshots, and notes."
  - "Generated project context and app instructions automatically tell Codex to use repo skills, verify sources online, avoid hallucinated citations, preserve provenance, and record workflow gaps."
  - "Research OS Desktop can drive a real paper workflow for the neural-network materials without relying on manual manuscript bypasses."
  - "The active app workflow for this paper can run in readable English mode without Chinese mojibake blocking progress."
  - "The generated research plan includes research content, motivation, expected contributions, related literature, theoretical setup, proof route, optional experiments, source verification, risks, and acceptance criteria."
  - "The local neural-network materials are imported into a project sandbox without committing raw input files."
  - "Official venue rules and citation metadata are refreshed online with recorded sources."
  - "The final paper package compiles and includes manuscript, appendix or supplement if needed, references, highlights, cover letter, checklist, source verification, proof audit, and required declarations."
  - "Yunwu review/rebuttal calls use gpt-5.5 xhigh if available, are redacted, measured, and stay within the hard USD 200 ceiling."
  - "App interaction records, app/workflow gap records, screenshots, run manifests, resource ledger entries, and archive records are preserved."
requires_confirmation: false
privacy_level: mixed
