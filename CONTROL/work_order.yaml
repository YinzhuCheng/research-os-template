  - "Need to remove run_manifest.jsonl, resource_ledger.jsonl, validation reports, logs, caches, or other preserved audit artifacts."
acceptance_criteria:
  - "The public user model is initialization, semi-automated loop research, and final product."
  - "Internal process stages are consolidated into clear responsibilities without bypassing kernel, resource, privacy, work-order, manifest, or ledger controls."
  - "The research loop blocks progression until the user accepts the previous artifact or provides revision instructions."
  - "Every user choice prompt provides a recommended option, default options, and a free-form natural-language path."
  - "Final product tracks support paper, research report, and software, including multi-select."
  - "Git-backed archives create a snapshot record with timestamp, phase, commit, and user description."
  - "Dashboard and Copilot expose the three-phase flow, final-product entry, archive entry, and structured button groups."
  - "Static validation, unit tests, privacy scan, and browser QA pass."
requires_confirmation: true
privacy_level: public
