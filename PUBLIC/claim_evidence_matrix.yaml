claims:
  - id: CLAIM-001
    claim: "Research OS Desktop can turn research conversations, draft plans, and demos into governed local .rosproj projects."
    status: supported
    evidence:
      - "docs/desktop-app.md"
      - "docs/architecture.md"
      - "skills/research-os-orchestrator/SKILL.md"
    counterevidence: []
    dissemination_targets:
      - "PUBLIC/research_brief.md"
      - "docs/desktop-app.md"
    privacy_level: public
  - id: CLAIM-002
    claim: "Human-in-loop stage gates are required quality controls for semi-automated research workflows."
    status: supported
    evidence:
      - "https://arxiv.org/abs/2501.04227"
      - "https://arxiv.org/abs/2502.18864"
      - "CONTROL/phase_gate.yaml"
      - "docs/process-contract.md"
    counterevidence: []
    dissemination_targets:
      - "docs/process-contract.md"
    privacy_level: public
  - id: CLAIM-003
    claim: "Automated research systems need traceable records connecting hypotheses, experiments, analysis, outputs, and audit artifacts."
    status: supported
    evidence:
      - "https://arxiv.org/abs/2504.08066"
      - "https://arxiv.org/abs/2508.14111"
      - "PROVENANCE/run_manifest.jsonl"
      - "PROVENANCE/resource_ledger.jsonl"
    counterevidence: []
    dissemination_targets:
      - "docs/architecture.md"
      - "docs/process-contract.md"
    privacy_level: public
  - id: CLAIM-004
    claim: "Long-running research workflows require resource limits, cost monitoring, failure records, and resumable state."
    status: supported
    evidence:
      - "https://arxiv.org/abs/2604.05854"
      - "skills/research-os-resource-guard/SKILL.md"
      - "config/schemas/resource_ledger.schema.json"
      - "docs/security-risk.md"
    counterevidence: []
    dissemination_targets:
      - "docs/security-risk.md"
      - "docs/testing.md"
    privacy_level: public
  - id: CLAIM-005
    claim: "Research OS Desktop keeps Codex execution behind repository rules, skills, hooks, sandbox policy, approvals, and sidecar-mediated runtime boundaries."
    status: supported
    evidence:
      - "https://developers.openai.com/codex/guides/agents-md"
      - "https://developers.openai.com/codex/skills"
      - "https://developers.openai.com/codex/mcp"
      - "https://developers.openai.com/codex/hooks"
      - "https://developers.openai.com/codex/agent-approvals-security"
      - ".codex/requirements.md"
      - "docs/architecture.md"
    counterevidence: []
    dissemination_targets:
      - "docs/architecture.md"
    privacy_level: public
  - id: CLAIM-006
    claim: "Research OS can deepen field-specific research behavior without losing harness control by representing domain knowledge as profiles, agent capability registries, artifact templates, skills, and validation scripts."
    status: supported
    evidence:
      - "domain_profiles/README.md"
      - "config/schemas/domain_profile.schema.json"
      - "config/schemas/agent_capability.schema.json"
      - "scripts/check_domain_profiles.ps1"
      - "scripts/check_agent_capabilities.ps1"
      - "docs/domain-profiles.md"
    counterevidence: []
    dissemination_targets:
      - "docs/domain-profiles.md"
    privacy_level: public
  - id: CLAIM-007
    claim: "The mathematics route intentionally keeps formal proof assistants optional by default and requires conjecture, example, counterexample, proof-strategy, proof-gap, and human-review states."
    status: supported
    evidence:
      - "domain_profiles/fundamental-mathematics/profile.yaml"
      - "skills/research-os-math-discovery/SKILL.md"
      - "templates/domain/fundamental-mathematics/math_discovery_case.template.yaml"
      - "https://deepmind.google/blog/alphageometry-an-olympiad-level-ai-system-for-geometry/"
      - "https://deepmind.google/blog/funsearch-making-new-discoveries-in-mathematical-sciences-using-large-language-models/"
    counterevidence: []
    dissemination_targets:
      - "docs/domain-profiles.md"
    privacy_level: public
  - id: CLAIM-008
    claim: "Research OS prevents the skill suite from becoming a loose toolbox by routing substantive research through a shared research kernel with candidate, evaluator, belief state, search trace, negative result, next-action policy, and human judgment gate objects."
    status: supported
    evidence:
      - "config/schemas/research_kernel.schema.json"
      - "templates/research_kernel/research_cycle.template.yaml"
      - "skills/research-os-research-kernel/SKILL.md"
      - "scripts/check_research_kernel.ps1"
      - "scripts/check_domain_kernel_bindings.ps1"
      - "scripts/check_no_orphan_skills.ps1"
    counterevidence: []
    dissemination_targets:
      - "docs/architecture.md"
      - "docs/process-contract.md"
    privacy_level: public
