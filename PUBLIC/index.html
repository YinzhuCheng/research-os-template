<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research OS Desktop Public Dashboard</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #f4f6f5; color: #16201c; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1120px; margin: 0 auto; }
    header, section { background: #fff; border: 1px solid #cad7d1; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    h1 { font-size: 30px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    p { color: #60706a; line-height: 1.55; }
    a { color: #0f5f51; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .item { border: 1px solid #d8e2dd; border-radius: 6px; padding: 12px; background: #fbfcfc; }
    .item strong, .item a { display: block; margin-bottom: 4px; overflow-wrap: anywhere; }
    code { background: #edf2f0; border-radius: 4px; padding: 2px 5px; }
  </style>
</head>
<body>
  <main>
    <header>
      <p><strong>Research OS Desktop</strong></p>
      <h1>公开项目仪表盘</h1>
      <p>主入口已经迁移到 <code>Tauri + React + Python sidecar</code> 桌面应用。这个页面只保留公开、脱敏的项目导航和审计资料。</p>
      <p><a href="../docs/desktop-app.md">Desktop App 使用说明</a> · <a href="../docs/architecture.md">架构说明</a> · <a href="../docs/environment.md">环境说明</a> · <a href="research_state.json">公开状态 JSON</a></p>
    </header>
    <section>
      <h2>Desktop App</h2>
      <div class="grid">
        <div class="item"><strong>Tauri</strong><span>Windows 桌面壳和 React 工作台。</span></div>
        <div class="item"><strong>Python sidecar</strong><span>项目、状态、权限、归档和 Codex runtime 网关。</span></div>
        <div class="item"><strong>.rosproj</strong><span>项目入口文件；同名目录是默认沙箱。</span></div>
      </div>
    </section>
    <section>
      <h2>公开资料</h2>
      <div class="grid" id="documents"></div>
    </section>
  </main>
  <script>
    fetch("dashboard_data.json")
      .then((response) => response.json())
      .then((data) => {
        const target = document.getElementById("documents");
        target.innerHTML = data.documents.map((doc) => `<div class="item"><a href="${doc.path}">${doc.label}</a><span>${doc.path}</span></div>`).join("");
      })
      .catch(() => {
        document.getElementById("documents").textContent = "无法读取 dashboard_data.json。";
      });
  </script>
</body>
</html>
